# Paper trading, v3: quote 3c around the BOOK MID (model_weight 0); the Chainlink model only acts as a guard
# through the filters (model_disagrees / fair_unstable / p range). Most consistent variant across the morning
# and night replays (reports/21, 24): +$36 and -$2.5. Still paper only: no variant has a proven 5m edge.
journal_dir = "data/journal"

[strategy]
assets = ["btc", "eth", "sol"]
half_spread = 0.03
model_weight = 0.0
quote_size = 10
join_only = true
start_s = 5
stop_s = 240
skew_per_share = 0.002

[filters]
max_disagree = 0.10
max_spread = 0.03
vol_spike_ratio = 2.0
max_fair_move = 0.10
fair_move_window_ms = 5000
toxic_shares = 10
toxic_fills = 2
toxic_window_ms = 5000
toxic_cooldown_ms = 30000

[risk]
state_file = "data/state/risk_5m_paper_v3.json"
max_net_shares_per_window = 20
max_cost_per_window = 12
max_open_worst_loss = 60
daily_loss_limit = 50
max_actions_per_sec = 20

[execution]
mode = "paper"
place_latency_ms = 150
cancel_latency_ms = 150
