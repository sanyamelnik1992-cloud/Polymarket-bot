# Paper trading, v3 candidate: v2 filters + quotes around a 50/50 blend of model and book mid, 3c spread.
# Selected on the morning replay (reports/21_replay_variants.txt); validate out-of-sample before any live use.
journal_dir = "data/journal"

[strategy]
assets = ["btc", "eth", "sol"]
half_spread = 0.03
model_weight = 0.5
quote_size = 10
join_only = true
start_s = 5
stop_s = 240
skew_per_share = 0.002

[filters]
max_disagree = 0.10
max_spread = 0.03
vol_spike_ratio = 2.0
max_fair_move = 0.10
fair_move_window_ms = 5000
toxic_shares = 10
toxic_fills = 2
toxic_window_ms = 5000
toxic_cooldown_ms = 30000

[risk]
state_file = "data/state/risk_5m_paper_v3.json"
max_net_shares_per_window = 20
max_cost_per_window = 12
max_open_worst_loss = 60
daily_loss_limit = 50
max_actions_per_sec = 20

[execution]
mode = "paper"
place_latency_ms = 150
cancel_latency_ms = 150
