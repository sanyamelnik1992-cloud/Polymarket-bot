# H PAPER (unit pmbot-5m-h): F (v3) + a STRICTER queue-imbalance guard, brother's plan reports/42 section 5 item 3.
#  reports/40: I 0.20-0.35 -> the bid drops 0.3-0.55c within 5 s, I < 0.10 -> -1.5c. F leaves below 0.30 and
#  returns at 0.50; H leaves below 0.50 and returns at 0.60.
# Verdict: markout 60 s after the fill (cents per share, hourly report) vs F on the same BTC windows.
journal_dir = "data/journal-h"

[strategy]
assets = ["btc"]              # D made most of its fills on BTC; one market = one clean comparison, less CPU
half_spread = 0.001          # = at the best bid (join_only caps at it)
model_weight = 0.0
vol_mult = 2.0                # realized BTC sigma at 30-300 s is ~0.20 bp/sqrt(s), the 1 s estimate gives 0.06-0.13
quote_size = 5                # exchange minimum
join_only = true
start_s = 5
stop_s = 240
skew_per_share = 0.002        # as D
max_open_price = 0.60         # open only near 0.5, on both sides so a pair can form. With "<= 0.50" (8 Nov from 12:00 UTC)
min_open_price = 0.40         # live had 5 of 5 one-sided losing windows at 0.19-0.48; the tails (< 0.40, > 0.60) lost in
                              # both halves of the paper data (reports/42). Unpaired loss <= $3.0, win >= $2.0
close_through_filters = true  # keep the bid that closes an unpaired lot while opening filters are on (live 8 Nov: 4 of 6
                              # losing windows swung our way first, filters had pulled the closing bid)
close_stop_s = 290            # closing bids until start+290 s (opening bids stop at stop_s)

[filters]
max_disagree = 0.10          # model is only a sanity check now
max_spread = 0.03
vol_spike_ratio = 2.0
max_fair_move = 0.0           # off: model jitter, not market risk
fair_move_window_ms = 5000
toxic_shares = 5              # one full quote swept -> block that side 30 s (D: 10 = its quote size)
toxic_fills = 2
toxic_window_ms = 5000
toxic_cooldown_ms = 30000
# live safety: in paper a dead feed also stops the simulated fills, live orders keep resting while we are blind
bn_max_age_ms = 1500          # BTCUSDT bookTicker updates many times a second; 1.5 s of silence = feed problem
book_max_age_ms = 4000        # CLOB socket answers PING every 2 s; 4 s of silence = dead socket
max_loop_lag_ms = 200
min_vol_5m_bp = 2.7           # trade only after a volatile 10 min (BTC top tercile, reports/40 section 6)
min_queue_imbalance = 0.50    # the guard: leave below 0.50 ...
queue_imbalance_hysteresis = 0.10   # ... re-enter at 0.60

[risk]
state_file = "data/state/risk_5m_h_paper.json"
resume_next_day = true       # paper: wait for the next UTC day instead of exiting
max_net_shares_per_window = 5   # one unpaired lot: no 2nd bid on a side until the other side fills
max_cost_per_window = 5       # ~2 fills of 5 shares per window
max_open_worst_loss = 6       # all unresolved windows + resting bids (also capped at 95% of the wallet balance)
daily_loss_limit = 20         # paper research: more fills for the markout verdict (F keeps the live -$2)
daily_loss_hard = false       # true = counted from the day's best + no lot opens whose total loss could pass
                              # the limit. Off: with the 0.40-0.60 band a lot risks up to $3 > $2 (owner decides)
max_losing_windows_in_row = 1000   # paper research: no pause
pause_after_losses_s = 1800
max_actions_per_sec = 5
kill_file = "STOP"

[execution]
mode = "paper"
place_latency_ms = 60          # measured in live 8 Nov: place median 52-62 ms, cancel 40-49 ms
cancel_latency_ms = 50
paper_queue = true
tick_ms = 10
fast_react = true
fast_move_sigmas = 1.0
heartbeat_s = 4
