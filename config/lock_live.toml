# TWAP-lock L3 — LIVE (REAL MONEY). Same rule as config/lock_tier.toml (its paper twin pmbot-lock-tier, a test checks it).
# L3 = L with PRICE TIERS (reports/47): p>=.99 -> ask<=.98 (the old live rule L), p>=.97 -> <=.95, p>=.95 -> <=.93, p>=.90 -> <=.91.
# Why (reports/50): the old rule L (p >= 0.99 only) made 0 live entries on 9 Nov — by the time the model reaches 0.99 other bots have
# bought every ask <= 0.98; L3 buys earlier only at a cheaper ask (paper 9 Nov: 13 entries, 13 won; replay of 9 Nov with the live limits: 50 entries, 0 lost).
# Risk: 5 shares, -$5/day as live L; open risk $5 = one entry at a time since reports/51 (live L had $10). Not started by default:
# the owner starts it (Telegram /restart pmbot-lock-live).
journal_dir = "data/journal-lock-live"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
theta = 0.90
agree = 0.90
dmin_bp = 0.5
adv1_bp = 1.0
adv3_bp = 2.0
jump_bp = 5.0
a_min = 0.90
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93], [0.90, 0.91]]
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0

[risk]
max_usd_per_entry = 5.0
max_open_usd = 5.0           # one entry at a time (reports/51): a reversal often hits several coins in the same window
daily_loss_limit = 5.0          # one loss is ~-$4.6: a second one before ~10 wins stops it until a human restarts it
state_file = "data/state/lock_live.json"
resume_next_day = false

[execution]
mode = "live"
