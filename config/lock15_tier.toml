# L3 on the 15-minute markets, PAPER (unit pmbot-lock-15-tier): the live rule L3 (config/lock_tier.toml, identical [lock]
# except duration; a test checks it) on the 15m Up/Down markets, which resolve by the same 60 s Chainlink TWAP.
# Why (reports/52): L15 with the plain rule p >= 0.99 made 0 entries in two days, like L on 5m; the 15m markets trade
# 3-6x more per window than 5m on ETH / SOL / XRP (9 Nov, 24 h: ETH 15m $385k vs 5m $405k with a third of the windows).
# Risk as the live twin: one entry at a time. Verdict: entries, share of losses and cents per share against pmbot-lock-tier.
journal_dir = "data/journal-lock-15-tier"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
duration = 900        # 15m windows; times below are seconds of the closing 5 minutes (end - 300 + rel)
theta = 0.90          # lowest tier probability; the tiers below set the price limit per probability
agree = 0.90
dmin_bp = 0.5
adv1_bp = 1.0
adv3_bp = 2.0
jump_bp = 5.0
a_min = 0.90
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93], [0.90, 0.91]]
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0
shock_sigmas = 3.0    # reports/58: the pause threshold is max(2.5 bp, 3 sigma of a 3 s move): in a volatile market 2.5 bp is not a shock
big_shares = 10       # reports/73 (owner 15 Nov: "15 минутки ... может увеличить деньги ... чтобы зарабатывали нормально"): 10 shares on
big_shares_p = 0.97   # the entries that did not lose so far, 5 on the rest. Strong = model >= 0.97 or window second >= 260:
big_late_rel = 260.0  # live + twin 10-15 Nov, 64 unique windows: strong 23 / 0 lost (+7 c a share at the seen ask), the rest 41 / 3
big_calm_s = 3.0      # (+1.7 c). Within 3 s of a Binance guard block the entry stays 5 (reports/71). Back to 5 everywhere:
                      # big_shares = 0. Next step (20 on the strong ones) only after 30 more strong live entries with <= 1 lost

[risk]
max_usd_per_entry = 10.0
max_open_usd = 10.0
max_open_entries = 1    # as live: one entry at a time
daily_loss_limit = 10.0
state_file = "data/state/lock15_tier_paper.json"
resume_next_day = true

[execution]
mode = "paper"
cl_feed = "both"      # reports/69: Chainlink from PolyBolt and the legacy RTDS socket, first arrival wins. RTDS alone timed out ~10 times
                      # on the night of 11-12 Nov (a few blind seconds each); live 5m runs "both" since 11 Nov 20:50 (reports/66)
paper_exec_ms = 300
