# L3 on the 15-minute markets, PAPER (unit pmbot-lock-15-tier): the live rule L3 (config/lock_tier.toml, identical [lock]
# except duration; a test checks it) on the 15m Up/Down markets, which resolve by the same 60 s Chainlink TWAP.
# Why (reports/52): L15 with the plain rule p >= 0.99 made 0 entries in two days, like L on 5m; the 15m markets trade
# 3-6x more per window than 5m on ETH / SOL / XRP (9 Nov, 24 h: ETH 15m $385k vs 5m $405k with a third of the windows).
# Risk as the live twin: one entry at a time. Verdict: entries, share of losses and cents per share against pmbot-lock-tier.
journal_dir = "data/journal-lock-15-tier"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
duration = 900        # 15m windows; times below are seconds of the closing 5 minutes (end - 300 + rel)
theta = 0.90          # lowest tier probability; the tiers below set the price limit per probability
agree = 0.90
dmin_bp = 0.5
adv1_bp = 1.0
adv3_bp = 2.0
jump_bp = 5.0
a_min = 0.90
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5            # 24 Nov (owner: "подними лимит денег на рабочих стратегиях, только проверь чтобы был баланс потере к
                      # выигрышу", reports/90): 2 -> 5 on the tiers below 0.99. Since 17 Nov 62 entries / 1 lost / +6.7 c a share
                      # at 2 shares; at ~0.91 a win is ~+8 c a share and a loss ~-92 c: one loss = ~11 wins, ~1 entry in 40 lost.
                      # A 5-share loss (~-$4.7) is 3.6 % of the wallet and keeps the bot running; the day stop ($5) ends the day
                      # at the second one. Was 2 since 16 Nov (reports/76).
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93], [0.93, 0.91]]   # reports/75 (16 Nov): the bottom tier needs p >= 0.93 (was 0.90). At p 0.90-0.93 the market
                      # price is the real odds: 527 window states 10-16 Nov, 8.0 % lost against a ~0.906 cost; live 39 entries / 4 lost
                      # (every live 15m loss). At p 0.93-0.95: 162 states / 4 lost (2.5 %). theta stays 0.90 so the journals keep the zone
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0
shock_sigmas = 3.0    # reports/58: the pause threshold is max(2.5 bp, 3 sigma of a 3 s move): in a volatile market 2.5 bp is not a shock
big_shares = 10       # reports/73, 75: 10 shares only when the model is >= 0.97 (15m live + twin: 14 entries, 0 lost; 434 states at
big_shares_p = 0.99   # reports/76: 10 shares only at p >= 0.99 (was 0.97): the one tier that never lost on real fills. Before: p 0.97-0.99, 6 lost = 1.4 %), 5 on the rest. The "late = strong" half of reports/73 (10 shares from window
big_late_rel = 0.0    # second 260 on) is OFF since 16 Nov: it stood on 23 / 0, the next 5 such live entries lost one at 10 shares
big_calm_s = 3.0      # (-$9.16), and by states the late p 0.90-0.93 entries lose 8-10 % like the early ones (reports/75).
                      # Within 3 s of a Binance guard block the entry stays 5 (reports/71). Back to 5 everywhere: big_shares = 0

[risk]
max_usd_per_entry = 10.0
max_open_usd = 10.0
max_open_entries = 1    # as live: one entry at a time
daily_loss_limit = 5.0  # reports/75: back to 5 (was 10 for one day): one 5-share loss (~-$4.6) keeps it running, the second loss
                        # of a day or one 10-share loss stops it until a human restarts it
state_file = "data/state/lock15_tier_paper.json"
resume_next_day = true

[execution]
mode = "paper"
cl_feed = "both"      # reports/69: Chainlink from PolyBolt and the legacy RTDS socket, first arrival wins. RTDS alone timed out ~10 times
                      # on the night of 11-12 Nov (a few blind seconds each); live 5m runs "both" since 11 Nov 20:50 (reports/66)
paper_exec_ms = 300
