# Перехватчик ("fair value" taker) on 5m windows — PAPER (reports/83; owner 19 Nov: "подумай как можно улучшить результат,
# проанализируй других игроков"). The Polymarket book lags Binance: when Binance moves, asks priced off slower feeds stay for
# seconds. All 3.9 M public taker trades of 9-16 Nov valued at resolution, with the Binance fair value taken 2 s BEFORE each trade:
# buys >= 15 c below fair earned +36 % of the money (5m, one entry per window: 308 windows a day, 8 of 8 days positive; every coin,
# every price band and both halves of the window positive), and 4 409 different wallets took them (top 5 = 12 % of the money).
# Rule: fair value of a side = Phi(ln(S_bn / K_bn) / (sigma_bn * sqrt(tau0 + 19.5))) (S_bn = Binance mid now, K_bn = mean of the
# Binance mids of [T-62, T-3], sigma_bn = rms of 10 s Binance returns of the last hour per 1 s, tau0 = seconds to the closing TWAP);
# buy the side whose best ask is >= 0.15 below its fair value, FAK capped at fair - 0.15, asks 0.05-0.95, 290-62 s before the end,
# one entry per window, held to resolution. Paper measures what a bot with our ~0.5 s reaction actually gets from the live book.
# Since 21 Nov: the PAPER TWIN of the live unit pmbot-lock-fair-live (config/lock_fair_live.toml, reports/83 section 10): the same
# [lock] (a test keeps them equal) and the same size and open limits (5 shares, 4 windows, $20 open); paper since 19 Nov 17:40
# at 10 shares: 275 entries, 123 won vs 100.7 break-even, +22.8 % of the money.
journal_dir = "data/journal-lock-fair"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
zone = "fair"
rel_lo = 10.0          # 290 s before the end (rel is measured from the anchor end - 300)
rel_hi = 238.0         # 62 s before the end: the closing TWAP starts here
fair_edge = 0.15
fair_pmin = 0.05
fair_pmax = 0.95
fair_sigma_s = 3600.0
fair_min_sigma_s = 1800.0
fair_react_bp = 0.3     # decide at once on a 0.3 bp Binance move, not up to 50 ms later (reports/83 section 8)
shares = 5            # = live twin pmbot-lock-fair-live (reports/83 section 10; 10 until 21 Nov)
max_entries_per_window = 3   # up to 3 entries a window, 15 s apart (reports/83 section 12; 1 until 22 Nov)
fair_gap_s = 15.0

[risk]
max_usd_per_entry = 5.0
max_open_usd = 20.0
max_open_entries = 4   # = live twin (one entry per coin of a window)
daily_loss_limit = 200.0   # paper: see the whole day
state_file = "data/state/lock_fair_paper.json"
resume_next_day = true

[execution]
mode = "paper"
paper_exec_ms = 500       # = the live twin's median signal -> exchange answer on 22 Nov (496 ms; was 300): paper fills must
                          # not assume a faster bot than the live one (reports/83 section 13)
cl_feed = "both"
