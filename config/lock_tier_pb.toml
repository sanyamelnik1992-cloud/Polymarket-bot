# "Ступени на быстрых ценах" — PAPER (unit pmbot-lock-tier-pb, reports/57). Exactly config/lock_tier.toml (the paper twin of live
# L3; a test keeps [lock] and [risk] equal) with one difference at the bottom: Chainlink prints come from PolyBolt, the new
# price socket (the same prints 0.23-0.29 s earlier, no dropped seconds), with the legacy RTDS socket as the fallback.
# Judge it against pmbot-lock-tier on the same hours: entries, misses of the paper fill, P&L, and stats.cl_lag_ms in `status`.
journal_dir = "data/journal-lock-tier-pb"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
theta = 0.90          # lowest tier probability (L: 0.99); the tiers below set the price limit per probability
agree = 0.90          # ... and from received Chainlink prints only (glitch guard)
dmin_bp = 0.5         # expected TWAP at least 0.5 bp past the strike in our favour
adv1_bp = 1.0         # Binance against us <= 1 bp over 1 s ...
adv3_bp = 2.0         # ... and <= 2 bp over 3 s
jump_bp = 5.0         # |Binance 1 s move| > 5 bp = glitch / crash: no entry
a_min = 0.90          # '99% mode': only asks 0.90-0.98 (history: 346 entries, 2 lost = 99.4%; recorder 26/26)
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5            # the size the live version would use on a ~$15-20 wallet
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93], [0.90, 0.91]]
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0
shock_sigmas = 3.0    # reports/58: the pause threshold is max(2.5 bp, 3 sigma of a 3 s move): in a volatile market 2.5 bp is not a shock
late_tier_rel = 260.0 # reports/59: the bottom tier (p < 0.95 at an ask <= 0.91) only from second 260: earlier it lost 7 % on the tapes and was 4 of the 5 live losses

[risk]
max_usd_per_entry = 5.0
max_open_usd = 5.0    # = live (twin): one entry at a time (reports/51; replay 7-9 Nov: same P&L as $10, fewer losses)
daily_loss_limit = 5.0
state_file = "data/state/lock_tier_pb_paper.json"
resume_next_day = true

[execution]
mode = "paper"
paper_exec_ms = 300
cl_feed = "both"       # reports/57: PolyBolt prints (0.25 s earlier) with RTDS as the fallback; the ONLY difference from lock_tier.toml
