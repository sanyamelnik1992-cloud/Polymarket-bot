# LM2 PAPER (unit pmbot-lock-maker2): LM with the bid capped at 0.96 instead of 0.98 and pulled on a Binance move
# >= 1 bp against in 3 s instead of 2 bp. Why (reports/46, BTC 24 h, maker buys on the side >= 2 bp ahead with calm
# Binance, seconds 240-294): every price 0.92-0.99 won ~100%; 0.98 earned +2.0c a share in 63 windows, 0.95-0.96
# +4.5c in 54 windows; with Binance moving >= 1 bp against, the same bids won only 67-88%. Verdict: P&L vs LM.
# TWAP-lock maker LM (PAPER): the L rule (config/lock.toml, identical [lock] except entry), but instead of buying the
# ask it keeps a BID for the decided side in the last minute: p - min_edge, capped at 0.98 and one cent under the
# best ask, pulled the moment the rule fails (Binance against us, model, feeds, risk). One lot of 5 shares per window.
# Exact-timing tape test on three recorder extractions (9 Nov, ~47 h): sellers hit bids <= 0.98 on the decided side
# in 61 windows, all 61 won; 30 of them had no ask a taker could buy (reports/45 section 4).
# Paper fills: the queue model of the paper makers (behind the size shown at our price; trade-through fills us).
journal_dir = "data/journal-lock-maker2"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
entry = "maker"
theta = 0.99
agree = 0.90
dmin_bp = 0.5
adv1_bp = 1.0
adv3_bp = 1.0                 # LM: 2.0 (reports/46: >= 1 bp against in 3 s -> 67-88% won)
jump_bp = 5.0
a_min = 0.90
a_max = 0.96                  # LM: 0.98 (reports/46: same win rate, twice the margin)
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5
max_entries_per_window = 1

[risk]
max_usd_per_entry = 5.0
max_open_usd = 10.0
daily_loss_limit = 5.0
state_file = "data/state/lock_maker2_paper.json"
resume_next_day = true

[execution]
mode = "paper"
paper_place_ms = 60
paper_cancel_ms = 50
