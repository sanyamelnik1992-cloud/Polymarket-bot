# L3 PAPER (unit pmbot-lock-tier): L with PRICE TIERS instead of the single threshold p >= 0.99 (reports/47).
# The lower the model probability, the cheaper the ask must be: p>=.99 -> ask<=.98 (= L), p>=.97 -> <=.95, p>=.95 -> <=.93,
# p>=.90 -> <=.91, asks 0.90 and up. Everything else is L's (a test checks it). Replay on public tapes (Binance 1 s as the Chainlink proxy,
# 5 shares, fills = taker executions in time order 0.3-2 s after the signal): see reports/47 for entries / losses / P&L against L.
# TWAP-lock bot L (PAPER): buy the decided side in the last minute of 5m windows (reports/44_twap_lock.md).
# Research 7-9 Nov 2026 (recorder, conservative book replay, one entry per window, 10 shares):
#   day 1 50/50 won +$28, day 2 (out of sample) 16/16 +$4.8; 4-day data-api history with a Binance proxy
#   394 entries 97.97% won (99.5% where the proxy reproduces the outcome) +$75 at 10 shares.
# reports/59 (10 Nov 19:00 UTC): the p 0.90-0.95 tier (ask <= 0.91) is REMOVED from live and its twins. With the floor and the pause on,
# every loss was in that tier: live 13 entries / 2 lost / -$3.58 (the other tiers 10 / 0 / +$3.25); replay 7-10 Nov 102 / 4 lost,
# the other tiers 91 / 0 lost. A win there is ~+$0.45, a loss ~-$4.58. Only stricter: every entry is an entry of the old rule.
journal_dir = "data/journal-lock-tier"

[lock]
assets = ["btc", "eth", "sol", "xrp"]
theta = 0.95          # lowest tier probability (L: 0.99); the tiers below set the price limit per probability
agree = 0.90          # ... and from received Chainlink prints only (glitch guard)
dmin_bp = 0.5         # expected TWAP at least 0.5 bp past the strike in our favour
adv1_bp = 1.0         # Binance against us <= 1 bp over 1 s ...
adv3_bp = 2.0         # ... and <= 2 bp over 3 s
jump_bp = 5.0         # |Binance 1 s move| > 5 bp = glitch / crash: no entry
a_min = 0.90          # '99% mode': only asks 0.90-0.98 (history: 346 entries, 2 lost = 99.4%; recorder 26/26)
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 2            # reports/70 (12 Nov): the p 0.95-0.97 tier buys 2 shares (was 5). Live 10-12 Nov: that tier 38 entries / 5 lost / -$10.74, the upper tiers 24 / 0 / +$9.31. 2 x 0.93 = $1.86 > the $1 exchange minimum
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93]]
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0
shock_sigmas = 3.0    # reports/58: the pause threshold is max(2.5 bp, 3 sigma of a 3 s move): in a volatile market 2.5 bp is not a shock
hedge_p = 0.65        # reports/64: insurance on a reversal. After an entry, when the model favours the OTHER side with p >= 0.65
                      # and that side sells at <= p - 0.20, buy as many shares of it (once per window): the window then ends at
                      # about -$1..-3 whatever happens, instead of -$4.7. Replay 7-11 Nov: +$16.81 -> +$18.22, losses < -$3: 3 -> 2
hedge_margin = 0.20   # right after a reversal the model is over-sure (0.80 on average, the other side won 63 %): a fair price only
hedge_slip = 0.02     # the order cap is at most the seen ask + 2 c (a live FAK is a dollar budget: no over-buying)
big_shares = 10       # reports/67 (owner 11 Nov: "давай 10"): 10 shares when the model is >= 0.97 (the 0.97 / 0.99 tiers), `shares` (2) below.
big_shares_p = 0.97   # Replay 7-11 Nov with the insurance and live limits: +$18.22 -> +$28.12, every day positive, worst trade -$4.44

[risk]
max_usd_per_entry = 10.0     # = live (reports/67): 10 shares from p 0.97
max_open_usd = 10.0
max_open_entries = 1         # = live: one entry at a time (reports/51)
daily_loss_limit = 10.0
state_file = "data/state/lock_tier_paper.json"
resume_next_day = true

[execution]
mode = "paper"
paper_exec_ms = 300
