# Hourly Up/Down, LAST MINUTE only, PAPER (unit pmbot-hourly-last, reports/74 section 5). The hourly markets resolve by one
# number: Binance 1 h close >= open (672 of 672 windows, 1-15 Nov). In the closing minute, when Binance is >= 3 sigma of the time
# left away from the open, the favoured side never lost (275 windows with trades) and still traded below 0.98 in ~4 windows a
# day, hundreds of shares at a time (public trades, reports/74_tools/hourly_lastmin.py). Who gets those asks is a speed race:
# this paper bot answers how many of them a bot with our latency can take (fills against the live book 300 ms later).
# The engine and the model are the old hourly taker's (pmbot/bot/hourly.py, Student-t, vol x 1.3): only the window differs.
# To live only on the owner's word, after >= 30 paper fills with <= 1 lost.
[hourly]
assets = ["btc", "eth"]
window_s = 60              # only the closing minute
min_ttc_s = 2              # not the last two seconds (an order takes ~0.3 s)
min_edge = 0.02            # model probability - ask - fee: at 3 sigma the model says ~0.984, so asks up to ~0.96 qualify
max_price = 0.97
min_price = 0.50           # the favoured side only
size_usd = 10.0
max_cost_per_market = 10.0 # one entry per hour and coin
max_open_cost = 20.0
daily_loss_limit = 40.0
cooldown_s = 20.0
vol_mult = 1.3
state_file = "data/state/risk_hourly_last_paper.json"
mode = "paper"
journal_dir = "data/journal-hourly-last"
