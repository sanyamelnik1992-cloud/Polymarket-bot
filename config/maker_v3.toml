# Мейкер v3 — PAPER (reports/96; owner 26 Nov: "проанализируй почему так быстро в минус ушли ... и как можно уменьшить убыточные сделки").
# The live v2 test lost its $5 day in the hour after 15:16 UTC: bids 1.5 c under the fair value while that value moved 3-6 c in ONE
# second (the late seconds of a window, the day's second most volatile hour); our cancel takes 150-450 ms, so faster takers picked the
# bids off (realised edge +0.7 c instead of 1.5 c; 4 of 16 filled orders paid more than the model's value at that second).
# v3 = v2 + one change: every bid at least k_time x the fair value's 1 s move under its reference, phi(z) / sqrt(tau0 + 19.5), times
# max(1, 10-min sigma / 1-h sigma) (maker.k_time, maker.vol_ratio). Window-level tape simulation (reports/96_tools/window_sim.py,
# 5-share orders, the live caps): 18-21 Nov +10.0 c a share (v2 +6.3), 22-25 Nov +11.7 (v2 +5.3), 26 Nov +9.4 (v2 +2.6), every day
# better; fewer filled windows (-30..-47 %), $ a filled window +12..+93 %, the chance of a $5 day stop within 50 windows on 26 Nov
# 16 % (v2 31 %). Same [lock] and every other [maker] number as config/maker_v2.toml (a test keeps it so).
journal_dir = "data/journal-maker-v3"

[lock]
assets = ["btc"]
zone = "fair"               # the Binance fair value (strike, BlockSigma), not the taker rule: FairMaker decides
rel_lo = 100.0              # window seconds 100..230 (reports/95: the first 100 s do not pay)
rel_hi = 230.0
fair_sigma_s = 3600.0
fair_min_sigma_s = 1800.0
fair_react_bp = 0.3         # a 0.3 bp Binance move wakes the quote loop at once
tick_ms = 200

[maker]
half_spread = 0.015         # the favourite: bid = min(fair, book mid) - 1.5 c, down to the 0.01 grid
dog_spread = 0.10           # the underdog (model fair < fav_p): 10 c under the reference, it only catches dislocations
fav_p = 0.5
gate_bp = 0.5               # no bid on a side while Binance moved against it by more than 0.5 bp over the last gate_s seconds
gate_s = 3.0
ref = "min"
shares = 5
max_side_shares = 10        # the live test's caps (paper twin: the same, so that the two see the same fills)
max_unpaired = 5
skew_c = 0.01
requote_c = 0.01
pull_bp = 1.5               # pull both bids for pause_s after a Binance move of max(1.5 bp, 2.5 sigma * sqrt(2 s)) within 2 s
pull_sigmas = 2.5
pull_s = 2.0
pause_s = 2.0
p_lo = 0.10
p_hi = 0.80                 # no bid on a side whose reference is above 0.80 (reports/95: no edge there, a loss costs $3.9 a fill)
k_time = 1.5                # each bid >= 1.5 x the fair value's 1 s move under its reference (reports/96)
vol_ratio = true            # ... x max(1, sigma of the last 10 min / sigma of the hour)
markout_s = [5, 30]
report_every_s = 3600        # paper: one mm_report an hour; the Telegram bot sends the paper makers in ONE message (reports/96)

[risk]
max_usd_per_entry = 5.0     # unused by the maker (each bid is `shares` at <= p_hi)
max_open_usd = 30.0         # worst case of open windows + every resting bid as if filled
daily_loss_limit = 30.0     # paper: a stop, then the next UTC day
state_file = "data/state/maker_v3.json"
resume_next_day = true

[execution]
mode = "paper"
paper_place_ms = 150        # a bid is live 150 ms after the decision: the live test measured place 152 ms (p95 668) in its first 44 minutes
paper_cancel_ms = 190       # and gone 190 ms after its cancel (live: median 187, p95 786 ms): with the old 60 / 50 the paper twin was too kind
cl_feed = "both"            # Chainlink prints only for the provisional result after each window
