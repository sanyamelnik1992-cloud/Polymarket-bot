# L3-15 on three more coins, PAPER (unit pmbot-lock-15-alt, reports/73 section 4): the 15-minute rule of pmbot-lock-15-tier
# (identical [lock] except the coins; a test checks it) on DOGE, BNB and HYPE. Why: 15m is the bot that earns, and its
# entries are limited by sellers leaving the book, not by the rule; these markets add ~75 % more windows. Open questions the
# paper run answers: do they resolve by the same Chainlink TWAP, is the model (no tails of their own: BTC's are used) right
# there, is there anybody to buy from (15m liquidity $350-600 against $1000-9700 on the four live coins).
# To live only after 50 paper entries with <= 5 % lost, per coin, on the owner's word.
journal_dir = "data/journal-lock-15-alt"

[lock]
assets = ["doge", "bnb", "hype"]
duration = 900        # 15m windows; times below are seconds of the closing 5 minutes (end - 300 + rel)
theta = 0.90          # lowest tier probability; the tiers below set the price limit per probability
agree = 0.90
dmin_bp = 0.5
adv1_bp = 1.0
adv3_bp = 2.0
jump_bp = 5.0
a_min = 0.90
a_max = 0.98
min_edge = 0.005
rel_lo = 240.0
rel_hi = 299.5
shares = 5            # reports/93 (26 Nov): the size of an entry within 3 s of a Binance guard block (big_calm_s, reports/71);
                      # every other entry buys big_shares = 10. History: 2 since 16 Nov (reports/76), 5 below p 0.99 since 24 Nov
                      # (reports/90: at ~0.91 a win is ~+8 c a share and a loss ~-92 c, one loss = ~11 wins).
max_entries_per_window = 1
tiers = [[0.99, 0.98], [0.97, 0.95], [0.95, 0.93], [0.93, 0.91]]   # reports/75 (16 Nov): the bottom tier needs p >= 0.93 (was 0.90). At p 0.90-0.93 the market
                      # price is the real odds: 527 window states 10-16 Nov, 8.0 % lost against a ~0.906 cost; live 39 entries / 4 lost
                      # (every live 15m loss). At p 0.93-0.95: 162 states / 4 lost (2.5 %). theta stays 0.90 so the journals keep the zone
sigma_floor_bp = 0.5  # reports/52: sigma never below 0.5 bp -> no entry on a 1-2 bp lead in a calm market. Only stricter than plain L3
                      # (every entry is also an L3 entry): ~40 % of the entries, ~1/4 of the losses in the replay of 7-10 Nov
floor_free_p = 0.99   # reports/55: when the unfloored model gives >= 0.99 it decides (the original L rule: 57 entries, 0 lost)
shock_bp = 2.5        # reports/55: no entry within 10 s of a 3 s Binance move > 2.5 bp either way (stale sigma, snap-backs)
shock_s = 10.0
shock_sigmas = 3.0    # reports/58: the pause threshold is max(2.5 bp, 3 sigma of a 3 s move): in a volatile market 2.5 bp is not a shock
big_shares = 10       # reports/93 (26 Nov, REAL MONEY, owner: "Деньги закину" = the wallet goes to ~$200 for the 10-share proposal):
big_shares_p = 0.93   # EVERY tier buys 10 shares (the lowest tier needs p >= 0.93, so 0.93 = all entries). Evidence: since 17 Nov 82
                      # live entries on this rule, 1 lost (1.2 % against 7.5 % priced in), +6.6 c a share. A 10-share loss is
                      # -$9.1..-9.6, <= 5 % of a ~$195 wallet. Was 0.99 (reports/76: 10 shares only at p >= 0.99). Back to 5 on every
                      # tier below 0.99 (big_shares_p = 0.99) at 2 losses in 30 entries.
big_late_rel = 0.0    # reports/75: the "late = strong" half of reports/73 is off (late p 0.90-0.93 entries lose 8-10 % like early ones)
big_calm_s = 3.0      # reports/71: within 3 s of a Binance guard block the entry buys `shares` (5), not 10

[risk]
max_usd_per_entry = 10.0
max_open_usd = 10.0
max_open_entries = 1    # as live: one entry at a time
daily_loss_limit = 9.0  # reports/93: a 10-share loss (-$9.1..-9.6) on a day without wins stops it until a human restarts it; after
                        # some wins it goes on and the next loss stops it. Was 5 (reports/75), 10 for one day (reports/73).
state_file = "data/state/lock15_alt_paper.json"
resume_next_day = true

[execution]
mode = "paper"
cl_feed = "both"      # reports/69: Chainlink from PolyBolt and the legacy RTDS socket, first arrival wins. RTDS alone timed out ~10 times
                      # on the night of 11-12 Nov (a few blind seconds each); live 5m runs "both" since 11 Nov 20:50 (reports/66)
paper_exec_ms = 300
